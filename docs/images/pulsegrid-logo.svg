<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">PulseGrid MIDI Studio</title>
  <desc id="desc">피아노 롤과 스텝 시퀀서를 형상화한 PulseGrid 로고</desc>

  <rect width="760" height="180" rx="28" fill="#111722"/>

  <!-- Piano-roll mark -->
  <rect x="34" y="30" width="120" height="120" rx="27" fill="#63D5A7"/>
  <g fill="#14251F">
    <rect x="53" y="51" width="51" height="13" rx="6.5"/>
    <rect x="81" y="78" width="53" height="13" rx="6.5"/>
    <rect x="53" y="105" width="68" height="13" rx="6.5"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="53" y="127" width="9" height="8" rx="3"/>
    <rect x="70" y="122" width="9" height="13" rx="3"/>
    <rect x="87" y="116" width="9" height="19" rx="3"/>
    <rect x="104" y="124" width="9" height="11" rx="3"/>
    <rect x="121" y="119" width="9" height="16" rx="3"/>
  </g>

  <!-- Wordmark -->
  <text x="187" y="102" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="1">
    <tspan fill="#F5F7FA">PULSE</tspan><tspan fill="#63D5A7">GRID</tspan>
  </text>
  <rect x="190" y="121" width="40" height="3" rx="1.5" fill="#63D5A7"/>
  <text x="244" y="129" fill="#8D99AA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="6">MIDI STUDIO</text>
</svg>
